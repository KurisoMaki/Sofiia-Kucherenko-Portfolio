.branch { transform-box: view-box; animation: au-open var(--bd) var(--ease) both;
          animation-delay: calc(var(--td) + var(--gap) + var(--t) * var(--spread)); }
@keyframes au-trunk { from { transform: scaleY(0); } }
@keyframes au-open { from { transform: rotate(calc(var(--closed) * var(--fold))); opacity: 0; }
                     15% { opacity: 1; } to { transform: rotate(0deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .trunk, .branch { animation: none; } }
</style>
