<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160">
<style>
  .trunk { stroke-dasharray: 150; stroke-dashoffset: 150;
           animation: grow 0.85s ease-out forwards; }
  .branch { transform-box: view-box; animation: open 0.8s cubic-bezier(.2,.75,.2,1.15) both; }
  @keyframes grow { to { stroke-dashoffset: 0; } }
  @keyframes open { from { transform: rotate(var(--closed)); opacity: 0; }
                    15% { opacity: 1; }
                    to { transform: rotate(0deg); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .trunk, .branch { animation: none; stroke-dashoffset: 0; opacity: 1; }
  }
</style>
